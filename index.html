<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- JOUW SCRIPT ALS MODULE -->
    <script type="module" src="javascript/gebruikers.js"></script>
    <title>Login</title>
</head>
<body>
    <div class="inlogschermlogos">
        <img class="logo" src="./img/Airosense1.png" alt="Airosense Logo">
    </div>
    <div class="login">
        <form method="get" class="login-form">
            <label for="email">E-mail</label><br>
            <input type="text" name="email" placeholder="E-mail" required><br>
            <label for="wachtwoord">Wachtwoord</label><br>
            <input type="password" name="wachtwoord" placeholder="Wachtwoord" required><br>
            <button type="submit">Inloggen</button>
        </form>
        <h2>Don't have an account?</h2>
        <a href="signup.html">Sign Up</a>
    </div>
    <div class="bottom-text">
        <p>Contact E-mail: <a href="mailto:airosense@hotmail.com">airosense@hotmail.com</a></p><br>
    </div>
</body>
</html>
