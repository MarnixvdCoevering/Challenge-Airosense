<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign up</title>
</head>

<body>
    <div class="signup">
        <h2>Regristreer bij Airosense</h2>
        <form action="/submit_signup" method="POST" class="signup-form">
            <label for="gebruikersnaam">Gebruikersnaam:</label><br>
            <input type="text" id="gebruikersnaam" name="gebruikersnaam" placeholder="Gebruikersnaam" required><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Email" required><br>

            <label for="wachtwoord">Wachtwoord:</label><br>
            <input type="password" id="wachtwoord" name="wachtwoord" placeholder="Wachtwoord" required><br>

            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="index.html">Log in here</a></p>
    </div>
    <div class="bottom-text">Contact: E-mailadres: airosense@hotmail.com</div>
</body>
</html>
