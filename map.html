<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airosense – Map</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="header">
    <a href="./map.html"><button class="knop menu">Map</button></a>
    <a href="./mainscreen.html">
        <img class="logo" src="./img/Airosense2.png" alt="Airosense Logo">
    </a>
    <a href="./vorigemetingen.html">
        <button class="knop menu">Metingen</button>
    </a>
</header>

<div class="gemeente-select">
    <label for="gemeenteDropdown">Selecteer gemeente</label>
    <select id="gemeenteDropdown">
        <option value="">-- Kies een gemeente --</option>
    </select>
    <button id="resetMap">Reset Nederland</button>
</div>

<div class="mapcontainer">
    <div id="map"></div>
</div>

<script>
/* =========================
   Supabase
========================= */
const supabaseClient = supabase.createClient(
    "https://shkpjdqcnxygpmzrmsnq.supabase.co",
    "sb_publishable_WSC4uJgY2EoUmwVVbzbgAA_VQrBAx5N"
);

/* =========================
   Map
========================= */
const nederlandBounds = [[50.5, 3.0], [53.8, 7.5]];

const map = L.map("map", {
    maxBounds: nederlandBounds,
    maxBoundsViscosity: 0.8
}).setView([52.2, 5.3], 7);

map.setMinZoom(7);
map.setMaxZoom(14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

/* =========================
   Styles
========================= */
const baseStyle = {
    color: "#000",
    weight: 1,
    fillOpacity: 0.7
};

const hoverStyle = { weight: 2 };
const selectedStyle = { weight: 3 };

let selectedGemeente = null;
let gemeenteLayers = {};

/* =========================
   Gemeenten (PDOK)
========================= */
const gemeenteWFS =
    "https://service.pdok.nl/cbs/gebiedsindelingen/2025/wfs/v1_0" +
    "?service=WFS&version=2.0.0&request=GetFeature" +
    "&typeNames=gebiedsindelingen:gemeente_gegeneraliseerd" +
    "&outputFormat=application/json&srsName=EPSG:4326";

fetch(gemeenteWFS)
.then(res => res.json())
.then(async geojson => {

    const dropdown = document.getElementById("gemeenteDropdown");

    L.geoJSON(geojson, {
        onEachFeature: (feature, layer) => {

            const naam = feature.properties.statnaam;

            if (!gemeenteLayers[naam]) {
                gemeenteLayers[naam] = L.featureGroup().addTo(map);
            }

            layer.baseStyle = {
                ...baseStyle,
                fillColor: "#ffffff"
            };

            layer.setStyle(layer.baseStyle);

            layer.on("mouseover", () => {
                if (selectedGemeente !== naam) {
                    layer.setStyle({ ...layer.baseStyle, ...hoverStyle });
                }
            });

            layer.on("mouseout", () => {
                if (selectedGemeente !== naam) {
                    layer.setStyle(layer.baseStyle);
                }
            });

            layer.bindPopup(`<b>${naam}</b>`);

            gemeenteLayers[naam].addLayer(layer);
        }
    });

    /* Dropdown vullen */
    Object.keys(gemeenteLayers)
        .sort((a, b) => a.localeCompare(b, "nl"))
        .forEach(g => {
            const option = document.createElement("option");
            option.value = g;
            option.textContent = g;
            dropdown.appendChild(option);
        });

    /* =========================
       Supabase → laatste meting per locatie
    ========================= */
    const { data, error } = await supabaseClient
        .from("meting")   // ✅ JUISTE TABELNAAM
        .select("locatie, eco2_waarde, datum")
        .order("datum", { ascending: false });

    console.log("Supabase data:", data);
    console.log("Supabase error:", error);

    if (error || !data) return;

    const laatstePerLocatie = {};
    data.forEach(m => {
        if (!laatstePerLocatie[m.locatie]) {
            laatstePerLocatie[m.locatie] = m;
        }
    });

    Object.values(laatstePerLocatie).forEach(m => {

        const group = gemeenteLayers[m.locatie];
        if (!group) return;

        const waarde = Number(m.eco2_waarde);
        if (isNaN(waarde)) return;

        let kleur;
        if (waarde > 1000) kleur = "#ff4d4d";
        else if (waarde > 500) kleur = "#ffcc00";
        else kleur = "#66cc66";

        group.eachLayer(l => {
            l.baseStyle = { ...l.baseStyle, fillColor: kleur };
            l.setStyle(l.baseStyle);

            l.bindPopup(`
                <b>${m.locatie}</b><br>
                ECO₂: ${waarde} ppm<br>
                Datum: ${new Date(m.datum).toLocaleString("nl-NL")}
            `);
        });
    });

    /* Dropdown select */
    dropdown.addEventListener("change", e => {
        const naam = e.target.value;
        if (!naam) return;

        if (selectedGemeente) {
            gemeenteLayers[selectedGemeente].eachLayer(l => {
                l.setStyle(l.baseStyle);
            });
        }

        selectedGemeente = naam;

        gemeenteLayers[naam].eachLayer(l => {
            l.setStyle({ ...l.baseStyle, ...selectedStyle });
        });

        map.fitBounds(gemeenteLayers[naam].getBounds(), { padding: [50, 50] });
    });

    /* Reset */
    document.getElementById("resetMap").addEventListener("click", () => {
        if (selectedGemeente) {
            gemeenteLayers[selectedGemeente].eachLayer(l => {
                l.setStyle(l.baseStyle);
            });
        }
        selectedGemeente = null;
        dropdown.value = "";
        map.fitBounds(nederlandBounds);
    });

    map.fitBounds(nederlandBounds);
});
</script>

</body>
</html>
