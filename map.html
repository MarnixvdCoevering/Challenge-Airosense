<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airosense – Map</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="header">
    <a href="./map.html"><button class="knop menu">Map</button></a>
    <a href="./mainscreen.html">
        <img class="logo" src="./img/Airosense2.png" alt="Airosense Logo">
    </a>
    <a href="./vorigemetingen.html">
        <button class="knop menu">Metingen</button>
    </a>
</header>

<div class="gemeente-select">
    <label for="gemeenteDropdown">Selecteer gemeente</label>
    <select id="gemeenteDropdown">
        <option value="">-- Kies een gemeente --</option>
    </select>
    <button id="resetMap">Reset Nederland</button>
</div>

<div class="mapcontainer">
    <div id="map"></div>
</div>

<script>
const SUPABASE_URL = "https://shkpjdqcnxygpmzrmsnq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WSC4uJgY2EoUmwVVbzbgAA_VQrBAx5N";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const nederlandBounds = [[50.5, 3.0], [53.8, 7.5]];

const map = L.map("map", {
    maxBounds: nederlandBounds,
    maxBoundsViscosity: 0.8
}).setView([52.2, 5.3], 7);

map.setMinZoom(7);
map.setMaxZoom(14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const baseStyle = { color:"#000", weight:1, fillOpacity:0.7 };
const hoverStyle = { weight:2 };
const selectedStyle = { weight:3 };

let selectedGemeente = null;
let gemeenteLayers = {};

const gemeenteWFS =
    "https://service.pdok.nl/cbs/gebiedsindelingen/2025/wfs/v1_0" +
    "?service=WFS&version=2.0.0&request=GetFeature" +
    "&typeNames=gebiedsindelingen:gemeente_gegeneraliseerd" +
    "&outputFormat=application/json&srsName=EPSG:4326";

const gemeenteDropdown = document.getElementById("gemeenteDropdown");

async function loadGemeenten() {
    const res = await fetch(gemeenteWFS);
    const geojson = await res.json();

    L.geoJSON(geojson, {
        onEachFeature: (feature, layer) => {
            const naam = feature.properties.statnaam;

            if (!gemeenteLayers[naam]) {
                gemeenteLayers[naam] = L.featureGroup().addTo(map);
            }

            layer.baseStyle = { ...baseStyle, fillColor:"#ffffff" };
            layer.setStyle(layer.baseStyle);

            layer.on("mouseover", () => {
                if (selectedGemeente !== naam) {
                    layer.setStyle({ ...layer.baseStyle, ...hoverStyle });
                }
            });

            layer.on("mouseout", () => {
                if (selectedGemeente !== naam) {
                    layer.setStyle(layer.baseStyle);
                }
            });

            layer.bindPopup(`<b>${naam}</b>`);

            gemeenteLayers[naam].addLayer(layer);
        }
    });
    
    Object.keys(gemeenteLayers)
        .sort((a,b)=>a.localeCompare(b,"nl"))
        .forEach(g=>{
            const option = document.createElement("option");
            option.value = g;
            option.textContent = g;
            gemeenteDropdown.appendChild(option);
        });

    await updateMapFromSupabase();
}
const THRESHOLDS = { eco2_warn:1000, eco2_danger:2000, tvoc_warn:220, tvoc_danger:660 };

function classifyAirQuality(eco2,tvoc){
    if(eco2>=THRESHOLDS.eco2_danger||tvoc>=THRESHOLDS.tvoc_danger) return "danger";
    if(eco2>=THRESHOLDS.eco2_warn||tvoc>=THRESHOLDS.tvoc_warn) return "warn";
    return "ok";
}

async function updateMapFromSupabase() {
    const { data, error } = await supabaseClient.from("meting")
        .select("locatie, eco2_waarde, tvoc_waarde, datum")
        .order("datum",{ascending:false});

    if(error || !data) return console.error(error);

    const latestPerLocatie = {};
    data.forEach(m=>{ if(!latestPerLocatie[m.locatie]) latestPerLocatie[m.locatie]=m; });

    Object.values(latestPerLocatie).forEach(m=>{
        const group = gemeenteLayers[m.locatie];
        if(!group) return;

        const status = classifyAirQuality(m.eco2_waarde, m.tvoc_waarde);
        const kleur = status==="danger"?"#ff4d4d":status==="warn"?"#ffcc00":"#66cc66";

        group.eachLayer(l=>{
            l.baseStyle = {...l.baseStyle, fillColor:kleur};
            l.setStyle(l.baseStyle);
            l.bindPopup(`<b>${m.locatie}</b><br>ECO₂: ${m.eco2_waarde} ppm<br>TVOC: ${m.tvoc_waarde} ppb<br>Datum: ${new Date(m.datum).toLocaleString("nl-NL")}`);
        });
    });
}
gemeenteDropdown.addEventListener("change", e=>{
    const naam = e.target.value; if(!naam) return;

    if(selectedGemeente) {
        gemeenteLayers[selectedGemeente].eachLayer(l=>l.setStyle(l.baseStyle));
    }

    selectedGemeente = naam;
    gemeenteLayers[naam].eachLayer(l=>l.setStyle({...l.baseStyle, ...selectedStyle}));
    map.fitBounds(gemeenteLayers[naam].getBounds(),{padding:[50,50]});
});

document.getElementById("resetMap").addEventListener("click", ()=>{
    if(selectedGemeente) gemeenteLayers[selectedGemeente].eachLayer(l=>l.setStyle(l.baseStyle));
    selectedGemeente = null;
    gemeenteDropdown.value="";
    map.fitBounds(nederlandBounds);
});
loadGemeenten().catch(console.error);
map.fitBounds(nederlandBounds);
</script>

</body>
</html>
